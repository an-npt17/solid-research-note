services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "5001:5173"
    volumes:
      - .:/app
      # keep the container's node_modules intact even with the bind mount above
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      css:
        condition: service_healthy

  # Community Solid Server — local Pod provider for demo/development
  # Register a new account at http://localhost:3000/.account/login/password/register/
  css:
    image: solidproject/community-server:latest
    ports:
      - "3000:3000"
    command:
      - "--port=3000"
      - "--baseUrl=${CSS_BASE_URL:-http://localhost:3000}"
      - "--config=@css:config/default.json"
      - "--showStackTrace"
    volumes:
      - css-data:/data
    healthcheck:
      # CSS exposes its OIDC discovery doc once the server is fully ready
      test:
        [
          "CMD-SHELL",
          "wget -q --spider https://nixos.tailfe5885.ts.net/.well-known/openid-configuration || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  css-data:
